name: SEO Rank Tracker

on:
  schedule:
    # 06:00 UTC every Monday. Checks where each tracked review ranks in Google.
    - cron: "0 6 * * 1"
  workflow_dispatch:        # lets you trigger a rank check manually
  push:
    # On-demand run without the Actions UI: commit a marker file under
    # .github/triggers/rank-* and the tracker runs once for that push. Scoped to
    # that path so ordinary code pushes never spend Serper credits.
    branches: [main]
    paths:
      - ".github/triggers/rank-*"

permissions:
  contents: write           # needed to commit the updated history.db back to the repo

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run rank tracker
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python -m src.learning.cli track run

      - name: Commit rank snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new rank snapshots to commit."
            exit 0
          fi
          git commit -m "SEO rank snapshots ($(date -u +%Y-%m-%d))"
          # Sync + rebase + retry: other workflows can push to main concurrently.
          for i in 1 2 3; do
            git fetch origin main || true
            git rebase origin/main || git rebase -X ours origin/main || git rebase --abort || true
            if git push origin HEAD:main; then
              echo "Pushed snapshots on attempt $i."
              exit 0
            fi
            echo "Non-fast-forward, retrying ($i/3)…"; sleep $((i * 3))
          done
          echo "Failed to push snapshots after 3 attempts." >&2
          exit 1
